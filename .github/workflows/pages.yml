name: Deploy Pages Site

# The scraper workflow only runs daily, but site/API-client changes in docs/
# or api/ should go live immediately. This deploys docs/ to GitHub Pages on
# every push that touches them. Vercel deploys itself from main automatically.

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'api/**'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
