name: Update AniList Database

# Architecture (exact anime mirror, zero credentials beyond GITHUB_TOKEN):
# - Shards (~15MB each, ~300 total) live as RELEASE ASSETS, never in git
#   (git cannot hold 4GB: 2GB push cap, 100MB/file block, 1GB repo guideline).
# - Git tracks only small files: metadata, search_index, sample, manifest, site.
# - The SQLite DB persists between ephemeral runners via actions/cache.
# - Full and scheduled runs use SEPARATE concurrency groups so the daily
#   refresh can never cancel a multi-hour full re-scrape.
# - Daily `daily` mode = airing titles fully refreshed + lightweight
#   trending/popularity/scores merged across the whole catalog.

on:
  schedule:
    - cron: '0 4 * * *'    # Daily 04:00 UTC -> daily refresh (incremental on Sundays)
  workflow_dispatch:
    inputs:
      fetch_mode:
        description: 'Fetch mode (full retired after bootstrap — weekly/daily cover rails)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - airing
          - counters
          - upcoming
          - incremental

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "anilist-update-${{ github.event.inputs.fetch_mode || 'scheduled' }}"
  cancel-in-progress: true

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine fetch mode (weekly rails refresh + daily airing+counters)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.fetch_mode }}" >> $GITHUB_OUTPUT
          else
            DOW=$(date -u +%-u)
            if [ "$DOW" = "7" ]; then
              # Weekly rails refresh: incremental (Just Finished flips + new
              # Upcoming, full payloads) + upcoming sweep (announcements) +
              # counters (Trending). `full` is bootstrap/repair only (manual
              # dispatch) — never scheduled.
              echo "mode=weekly" >> $GITHUB_OUTPUT
            else
              echo "mode=daily" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Restore database cache (runners are ephemeral)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/anilist.db
            data/.checkpoint.json
            data/turso_sync_progress.json
          key: anilist-db-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          restore-keys: |
            anilist-db-

      - name: Restore DB from release if cache missed (self-healing)
        if: hashFiles('data/anilist.db') == ''
        run: |
          mkdir -p data
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No cache and no release: starting from empty DB (bootstrap will fill it)."
            exit 0
          fi
          echo "Cache missed: downloading anilist.db.gz from $TAG (~380MB)..."
          gh release download "$TAG" -p "anilist.db.gz" -O data/anilist.db.gz
          gunzip -f data/anilist.db.gz
          ls -lh data/anilist.db
          python -c "import sys; sys.path.insert(0,'scripts'); from db_utils import connect_db; print('rows:', connect_db('data/anilist.db').execute('SELECT COUNT(*) FROM anime').fetchone()[0])"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail-safe (never rebuild shards from a partial DB)
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          COUNT=$(python -c "import sys,os; sys.path.insert(0,'scripts'); from db_utils import connect_db; p='data/anilist.db'; print(connect_db(p).execute('SELECT COUNT(*) FROM anime').fetchone()[0] if os.path.exists(p) else 0)")
          echo "Existing DB rows: $COUNT (mode=$MODE)"
          if [ "$MODE" != "full" ] && [ "$COUNT" -lt 10000 ]; then
            echo "::error::DB has only $COUNT rows — refusing $MODE run that would shrink 14k shards to partial data. Run a full fetch first."
            exit 1
          fi

      - name: Run fetcher
        env:
          FETCH_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo "Starting $FETCH_MODE fetch at $(date -u)"
          python scripts/fetch_anilist.py
          echo "Fetch completed at $(date -u)"

      - name: Sync to Turso (daily deltas only — never counters, never full)
        # Counters mode refreshes numbers + cuts a release but never touches
        # Turso. Only merged daily (airing) and weekly runs sync deltas.
        if: steps.mode.outputs.mode != 'counters'
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # Design: full fetch builds local files only. Turso receives ONLY
          # daily deltas (touched IDs). The one-time full fill comes from a
          # fresh-DB file import, never from this step.
          python scripts/turso_sync.py --max-minutes 45
          echo "Turso sync completed at $(date -u)"

      - name: Generate API data (EXACT shards)
        run: python scripts/api_generator.py

      - name: Show database stats
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from db_utils import connect_db, get_database_stats; import json; conn = connect_db('data/anilist.db'); stats = get_database_stats(conn); print(json.dumps(stats, indent=2)); conn.close()"

      - name: Verify EXACT shards (fail if snake_case leaks or FuzzyDate broken)
        run: |
          python - <<'EOF'
          import json, glob
          shards = sorted(glob.glob('docs/api/shards/shard_*.json'))
          assert shards, 'no shards generated'
          sample = json.load(open(shards[0]))[0]
          assert 'title' in sample and isinstance(sample['title'], dict), 'shard not exact: title object missing'
          assert 'title_romaji' not in sample, 'snake_case leak (break-now exact only)'
          assert isinstance(sample.get('startDate'), dict), 'startDate must be FuzzyDate {year,month,day}'
          assert isinstance(sample.get('coverImage'), dict), 'coverImage must be object'
          assert sample.get('type') == 'ANIME', 'anime-only mirror must set type=ANIME'
          print(f"EXACT check OK: {len(shards)} shards, sample id={sample.get('id')}")
          EOF
          ls docs/api/shards/shard_*.json | wc -l
          gzip -kf docs/api/search_index.json || true
          python scripts/api_generator.py manifest

      - name: Resolve release tag
        id: rel
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          DATE=$(date -u +'%Y-%m-%d')
          # Every date gets its own checkpoint release: first run of the day
          # creates db-<date>, later runs that day clobber-update it.
          echo "tag=db-$DATE" >> $GITHUB_OUTPUT
          if gh release view "db-$DATE" --json tagName -q .tagName >/dev/null 2>&1; then
            echo "create=false" >> $GITHUB_OUTPUT
          else
            echo "create=true" >> $GITHUB_OUTPUT
          fi
          ANIME_COUNT=$(python -c "import sys; sys.path.insert(0, 'scripts'); from db_utils import connect_db; conn = connect_db('data/anilist.db'); print(conn.execute('SELECT COUNT(*) FROM anime').fetchone()[0]); conn.close()")
          echo "anime_count=$ANIME_COUNT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release (full only)
        if: steps.rel.outputs.create == 'true'
        run: |
          gh release create "${{ steps.rel.outputs.tag }}" --title "AniList Database - ${{ steps.rel.outputs.date }}" \
            --notes "## AniList Offline Database (exact anime mirror)

          **Date:** ${{ steps.rel.outputs.date }}
          **Total Anime:** ${{ steps.rel.outputs.anime_count }}
          **Schema:** anilist-exact-anime-v2 (same fields as graphql.anilist.co)

          ### Files
          - \`anilist.db.gz\` - Compressed SQLite database (raw AniList JSON + indexes)
          - \`anilist.json.gz\` - Compressed full JSON export (streamed)
          - \`shard_*.json.gz\` - GraphQL API shards (50 anime each, AniList-exact Media objects)

          ### Use without rate limits
          \`\`\`graphql
          # Point any AniList client at the Vercel endpoint or Pages mirror
          { Page(page: 1, perPage: 10) { media(sort: POPULARITY_DESC, type: ANIME) { id title { romaji } } } }
          \`\`\`" --latest || echo "Release may already exist, continuing"
          # Drop the stale old-shape tarball from earlier runs if present (exact DB ships as db/json gz)
          gh release delete-asset "${{ steps.rel.outputs.tag }}" "anilist-db-${{ steps.rel.outputs.date }}.tar.gz" -y 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload shard assets (full = all, others = changed only)
        run: |
          cd docs/api/shards
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            ls shard_*.json.gz | xargs -P 8 -n 20 gh release upload "${{ steps.rel.outputs.tag }}" --clobber
          else
            echo "changed-shard diff not yet implemented; uploading all shards"
            ls shard_*.json.gz | xargs -P 8 -n 20 gh release upload "${{ steps.rel.outputs.tag }}" --clobber
          fi
          cd ../../..
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk (shards are now on the release)
        run: |
          rm -rf docs/api/shards
          df -h / | tail -1

      - name: Compress database archives
        run: |
          gzip -k -f data/anilist.db
          ls -lh data/*.gz
          test -f data/anilist.json.gz || gzip -k -f data/anilist.json || true
          ls -lh data/*.gz

      - name: Upload database archives
        run: |
          gh release upload "${{ steps.rel.outputs.tag }}" --clobber data/anilist.db.gz data/anilist.json.gz || \
          gh release upload "${{ steps.rel.outputs.tag }}" --clobber data/anilist.db.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp release tag (clients resolve shards from it)
        run: |
          python scripts/api_generator.py stamp "${{ steps.rel.outputs.tag }}"
          cat docs/api/shard_manifest.json | head -12

      - name: Commit small files only (never DB/shards — see header)
        run: |
          git rm --cached -r --ignore-unmatch docs/api/shards data/anilist.db data/anilist.json data/anilist.db.gz data/anilist.json.gz || true
          git add docs/api/metadata.json docs/api/search_index.json docs/api/search_index.json.gz \
            docs/api/sample.json docs/api/shard_manifest.json docs/index.html docs/api.js \
            .github/workflows/update-db.yml
          # changelog.md only exists after incremental runs — never fail the add on it
          test -f data/changelog.md && git add data/changelog.md || true
          echo "Refusing to push any staged file over 90MB (fail fast, not after a 2-min push):"
          git diff --cached --name-only -z | xargs -0 -I{} sh -c 'test -f "{}" && stat -c "%s {}" "{}"' | \
            awk '$1 > 90000000 {print "TOO BIG:", $0; bad=1} END {if (bad) exit 1}'
          CHANGES=$(git diff --cached --stat)
          if [ -z "$CHANGES" ]; then
            echo "No changes to commit"
          else
            echo "Changes detected:"
            echo "$CHANGES"
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "update: ${{ steps.mode.outputs.mode }} fetch - ${{ steps.rel.outputs.anime_count }} anime - $TIMESTAMP"
          fi

      - name: Push changes
        run: git push

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/anilist.db
            data/.checkpoint.json
            data/turso_sync_progress.json
          key: anilist-db-${{ steps.mode.outputs.mode }}-${{ github.run_id }}

  deploy-pages:
    needs: fetch-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
